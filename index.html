<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />

        <title>Imuno</title>
    </head>
    <body>
        <div class="layout">
            <!-- SIDEBAR -->
            <aside class="sidebar">
                <h2 class="logo">imuno</h2>

                <nav class="menu">
                    <label class="nav-item">
                        <input type="checkbox" />
                        <span>მთავარი</span>
                    </label>

                    <label class="nav-item active">
                        <input type="checkbox" checked />
                        <span>ჩემი ფორმები</span>
                    </label>

                    <label class="nav-item">
                        <input type="checkbox" />
                        <span>პაციენტები</span>
                    </label>
                    <label class="nav-item">
                        <input type="checkbox" />
                        <span>ორგანიზაციები</span>
                    </label>

                    <label class="nav-item">
                        <input type="checkbox" />
                        <span>კვლევები</span>
                    </label>

                    <label class="nav-item">
                        <input type="checkbox" />
                        <span>მასალები</span>
                    </label>
                    <label class="nav-item">
                        <input type="checkbox" />
                        <span>მასალის მიღება</span>
                    </label>

                    <label class="nav-item">
                        <input type="checkbox" />
                        <span>ანგარიშგება</span>
                    </label>
                    <label class="nav-item">
                        <input type="checkbox" />
                        <span>ხარისხის კონტროლი</span>
                    </label>
                    <label class="nav-item">
                        <input type="checkbox" />
                        <span>პარამეტრები</span>
                    </label>
                </nav>
                <!-- 👇 logout -->

                <label class="nav-item logout-item">
                    <input type="checkbox" />
                    <span>გასვლა</span>
                </label>
            </aside>

            <!-- MAIN -->
            <main class="main">
                <!-- HEADER -->
                <div class="topbar">
                    <div class="left">
                        <button class="burger" id="burger">☰</button>
                        <h1>მასალის რეგისტრაცია</h1>
                    </div>
                    <div class="actions">
                        <button class="btn">შენახვა</button>
                        <button class="btn">ახალი</button>
                        <button class="btn primary">გაგზავნა</button>
                    </div>
                </div>

                <!-- INFO BAR -->
                <div class="content">
                    <div class="info-bar">
                        <div class="info">
                            <div class="info-item">
                                <span class="label">ფორმის ნომერი</span>
                                <strong>REQ-2025-05-20-000123</strong>
                            </div>

                            <div class="info-item">
                                <span class="label">სტატუსი</span>
                                <span class="badge">შესავსები</span>
                            </div>

                            <div class="info-item">
                                <span class="label"> შექმნის დრო</span>
                                <span>20/05/2025 10:15</span>
                            </div>

                            <div class="info-item">
                                <span class="label">QR /ბარ კოდი</span>
                                <input
                                    type="text"
                                    class="barcode"
                                    placeholder=""
                                />
                            </div>
                        </div>
                    </div>

                    <!-- FORM CARD -->
                    <div class="card">
                        <div class="card-header">
                            <h3>1. ორგანიზაცია</h3>
                            <span class="helper">მინიმალური</span>
                        </div>
                        <div class="grid-3">
                            <!-- ორგანიზაცია -->
                            <div class="form-group">
                                <label>ორგანიზაცია *</label>
                                <select>
                                    <option>აირჩიე ორგანიზაცია</option>
                                    <option>მედისონ კლინიკა</option>
                                    <option>ევექსი</option>
                                    <option>გული კლინიკა</option>
                                </select>
                            </div>

                            <!-- განყოფილება -->
                            <div class="form-group">
                                <label>განყოფილება</label>
                                <select>
                                    <option>აირჩიე განყოფილება</option>
                                    <option>ლაბორატორია</option>
                                    <option>რენტგენი</option>
                                    <option>თერაპია</option>
                                </select>
                            </div>

                            <!-- დამატებითი მეილი -->
                            <div class="form-group">
                                <label>დამატებითი მეილი</label>
                                <input
                                    type="email"
                                    placeholder="info@medisoni.ge"
                                />
                            </div>
                        </div>
                    </div>

                    <div class="grid-2-section">
                        <!-- პაციენტი -->
                        <div class="card">
                            <h3>2. პაციენტი</h3>

                            <!-- 1 ხაზი -->
                            <div class="grid-1">
                                <div class="form-group">
                                    <label>სახელი და გვარი *</label>
                                    <input
                                        type="text"
                                        placeholder="სახელი და გვარი"
                                    />
                                </div>
                            </div>

                            <!-- 2 ხაზი -->
                            <div class="grid-3">
                                <div class="form-group">
                                    <label>სქესი *</label>
                                    <select>
                                        <option>აირჩიე</option>
                                        <option>მამრობითი</option>
                                        <option>მდედრობითი</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label>დაბადების თარიღი *</label>
                                    <input type="date" />
                                </div>

                                <div class="form-group">
                                    <label>ასაკი</label>
                                    <input type="number" placeholder="ასაკი" />
                                </div>
                            </div>

                            <!-- 3 ხაზი -->
                            <div class="grid-2">
                                <div class="form-group">
                                    <label>პირადი ნომერი *</label>
                                    <input
                                        type="text"
                                        placeholder="პირადი ნომერი"
                                    />
                                </div>

                                <div class="form-group">
                                    <label>ტელეფონი *</label>
                                    <input type="text" placeholder="ტელეფონი" />
                                </div>
                            </div>
                            <!-- კვლევები -->
                        </div>
                        <div class="card">
                            <h3>3. კვლევები</h3>

                            <input type="text" placeholder="კვლევის ძიება" />

                            <div class="tags">
                                <span>CBC</span>
                                <span>Urea</span>
                                <span>Creatinine</span>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
